# 호가 가격 단위 형식 예제 (03 D-056, krx-market X-U1). 자리표시자만.
# 실제 표는 config/ticks/krx.toml (X-U1 확인 2026-10-08, CP-032 D-173). 파일이 없으면 지정가 주문은 거부된다(시장가만).
# 다른 시장 표를 만들 때 이 형식을 따른다. 출처·버전 필수, 가격·단위는 문자열(float 금지).
# 구간은 오름차순, 마지막 구간의 below는 "none".

source = "<출처: KRX 업무규정 시행세칙 URL>"
version = "<시행일 또는 확인일>"

[bands]
