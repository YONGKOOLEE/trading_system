# PAPER 배포 설정 (T-020 형식, T-015 시작 점검용 초안). 비밀정보 없음. 로더: trading_system.config.app_file.

[app]
account = "KR-PAPER-01"
loop_seconds = "0.5"
reconcile_minutes = 1
# SNTP 서버: 주소 미확인. SNTP 외부 연결 승인 전에는 사용하지 않는다(시작 점검은 시계 미점검으로 보고).
sntp_servers = ["time.kriss.re.kr:123", "time.bora.net:123"]

# 키움 모의 접속 스위치. 승인 A-035. **사용자가 직접 true로 바꾼다** (에이전트는 바꾸지 않는다).
[paper]
connection_approved = true

# PAPER-0 종목: 사용자 결정 A-037 (삼성전자 1종목).
[[instruments]]
code = "005930"
kind = "STOCK"
leverage = "1"
lot_size = "1"

# PAPER-0 검증 전략 (T-016, 04 §4.1). verification_approval = DP-24 해법 (a) 승인 A-037.
# 신호가 나가려면 상태가 PAPER여야 한다: scripts/strategy.py transition (사용자 승인 A-ID 필요, INV-13)
[[strategies]]
module = "trading_system.strategy.paper0_verify:Paper0Verify"
params = "config/strategies/paper0-verify-v1.toml"
eval_times = ["09:30", "14:30"]
verification_approval = "A-037"
