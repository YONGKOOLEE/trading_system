# 저녁 수집 설정 (CP-033 D-192·D-194, 승인 A-100 Q-6 (a)·Q-8 (b)). 비밀정보 없음. 로더: trading_system.app.investor_collect.
# 자동 운영(scripts/autopilot.py)의 15:45 종료 절차(마감 대조 → run 정상 종료 → paper-review → 백업 → 일일 요약) 뒤 한 단계.
# **기본 꺼짐.** 켜기(enabled = true)는 사용자가 직접 한다 — A-100 "자동 운영 절차 변경은 구현·시험 뒤 적용".
# 꺼져 있거나 이 파일이 없으면 자동 운영은 지금과 똑같이 동작한다(기록·알림 없음). 수집 실패는 경고 알림·기록만.
enabled = false

# 수집 대상 종목 목록 (A-100 Q-8 (b): 코스피200 구성 종목 전체). `code,...` 머리 줄 CSV 또는 한 줄에 코드 하나.
# 실행 산출물 폴더(var/, git 제외)의 파일이다 — 목록을 바꾸려면 이 경로를 바꾼다.
codes_file = "var/backtest/data/kiwoom-kospi200-adj-20261009/meta/kospi200-constituents.csv"

# 확인 구간(거래일, 1~120): 매일 최근 N거래일을 다시 받아 같은 값이면 관측만 추가, 다르면 정정(새 회차) — D-190·D-192.
window_days = 5

# 마감 시한(KST, 15:45 초과 ~ 17:30 이하): 이 시각이 지나면 남은 종목은 조회하지 않는다(작업 스케줄러 실행 상한 17:45 전).
deadline = "17:30"

# 재무 스냅샷 축적(CAP-DAT-05b, ka10001 — T-037). 판정·백테스트 입력에 쓰지 않는다.
financials = false
