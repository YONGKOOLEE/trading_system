# 정책 프로필 "research" (CP-034 D-196, 값 A-093 2026-10-12). 용도: 백테스트·검증 실행기 --limits config/limits.research.toml (연구용).
# 값은 단일 전략 기준. 전략이 N개면 L6 = 3 × N, L5 = 3 × N, L3 = 슬롯 합 × L2(최대 100%) — 바꿀 때는 사용자 지시와 01 §2.3.1(완화는 다음 일일 기준 시각).
# 기준 금액 = 일일 기준 시각의 순자산(예수금 + 보유 평가액). 비율은 소수(0.005 = 0.5%). paper0(limits.paper.toml, A-034)은 이 파일과 별개로 그대로다.

account = "KR-BT-01"
profile = "research"
approved_by = "A-093"

[limits]
l1_max_loss_ratio = "0.005"        # 1회 최대 손실 0.5% (A-093)
l2_max_symbol_ratio = "0.10"       # 종목 비중 10%
l3_max_total_ratio = "0.30"        # 총 노출 = 슬롯 합 3 × L2 10% (A-093, 최대 100%)
l4_daily_loss_ratio = "0.02"        # 일일 손실 → K2 (A-093: 연구 2%, PAPER-1 1.5%)
l5_daily_new_orders = 5            # 일일 신규 주문 (단일 전략 5, 다전략 3 × N)
l6_max_positions = 3               # 보유 종목 (전략별 3, 계좌 3 × N)
l7_max_order_ratio = "0.10"        # 1회 주문 최대 = 기준 금액 × 10% (비율 정의, A-093)
l10_leverage_total_ratio = "none"  # 레버리지·인버스 상품 미사용
warn_usage_ratio = "0.80"          # 한도 80% 사용 시 경고
l1_entry_buffer_ratio = "0.03"     # L1 시장가 기준가 여유 3% (D-195, A-091 Q-1)

[time]
order_window_start = "09:10"
order_window_end = "15:10"
daily_reference_time = "08:00"
report_time = "16:00"
