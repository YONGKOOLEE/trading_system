# btc-trend v1 — 사용자 결정 2026-10-17(1회 위험 5%, 피라미딩 없음). 탐색 근거 research/2026-10-17-crypto-design.md.
strategy = "btc-trend"
version = 1

[params]
entry_n = 25          # 돌파 기간(탐색 고원 15~40일 중 가운데, 24경계 중앙 MDD 낮은 쪽)
exit_n = 50           # 청산 50일선(탐색에서 가장 일관된 축)
stop_atr = "2"        # 손절 ATR14 × 2
risk_ratio = "0.05"   # 1회 위험 5% (사용자). 운영 M2 PAPER 한도(L1 0.5%·L2 10%, A-064)는 이 값을 막음 — PAPER는 축소 운영, LIVE는 한도 재결정 필요
max_weight = "0.98"   # 레버리지 없음 — 운영 매수는 시가×1.005 IOC 지정가라 100%는 L2·현금에 걸림(2026-10-17 엔진 대조에서 확인)
order_cap = "1000000000" # 상한 없음(한도 파일이 통제)
