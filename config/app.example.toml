# 배포 설정 형식 예제 (T-020). 자리표시자 — 복사해 config/app.<mode>.toml 로 만들고 값을 채운다. 비밀정보는 넣지 않는다.
# 로더: trading_system.config.app_file. 기본값 없음(누락·형식 오류면 시작 거부).

[app]
account = "<계좌 별칭, 예: KR-PAPER-01 — 한도 파일의 account와 같게>"
loop_seconds = "<판정·실행 루프 주기 초, 문자열 소수, 예: 0.5 (운영 명령 1초 처리를 위해 1 이하 권장)>"
reconcile_minutes = "<장중 주기 대조 분, 정수 1 이상 (설계 제안 1분)>"
sntp_servers = ["<host:123>", "<host:123>"]   # 2곳 권장 (03 §5.3)

# PAPER 모드에서만. 키움 모의 접속은 사용자 승인(T-015) 후 사용자가 직접 true로 바꾼다. 에이전트는 바꾸지 않는다.
# [paper]
# connection_approved = false

# PAPER 모드에서만, 선택. 텔레그램 알림·원격 명령(03 D-052). true면 .env.paper에 TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID 필요.
# 사용자가 scripts/telegram-test.py 성공을 확인한 뒤 직접 켠다. 켜면 알림 연속 실패 3회 → K11(신규·증액 차단).
# [telegram]
# enabled = false

[[instruments]]
code = "<6자리 종목코드>"
kind = "<STOCK|ETF|ETN>"
leverage = "<부호 포함 배수 문자열, 일반 주식 1>"
lot_size = "<수량 단위, 국내 주식 1>"

[[strategies]]
module = "<패키지.모듈:클래스>"
params = "<config/strategies/<전략>.toml>"
eval_times = ["<HH:MM KST>"]
# (선택, CP-034 D-197) 전략별 보유 슬롯(정수 ≥ 1). 없으면 슬롯 검사 없음. 배정하면 모든 전략에 배정하고 합 ≤ 계좌 L6.
# 배정되지 않은 계좌 슬롯은 어떤 전략도 쓰지 않는다(A-092 Q-7).
# l6_slots = <정수>
